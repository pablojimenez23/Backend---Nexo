spring.application.name=ms-users

# Puerto de ms-users (ms-stores: 8082, ms-products: 8083, ms-orders: 8084)
server.port=8081

# Conexión a RDS — el endpoint se completa una vez creada la instancia en AWS
spring.datasource.url=jdbc:mysql://nexo-db.cg1wfibpbzep.us-east-1.rds.amazonaws.com:3306/users_db?useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${username}
spring.datasource.password=${password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Limitar el pool de conexiones para no agotar el límite de RDS (db.t3.micro)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2

# Credenciales de RDS gestionadas por Secrets Manager
spring.config.import=aws-secretsmanager:nexo/rds/credentials

# Hibernate crea/actualiza las tablas automáticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Valida el JWT emitido por Cognito (Google como IdP) — misma URL en los 4 microservicios
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://cognito-idp.us-east-1.amazonaws.com/us-east-1_ZoKCVBrHG

# Logging reducido para producción
logging.level.com.nexo.msusers=INFO
logging.level.org.springframework.security=INFO

# Expone /actuator/health para el health check del ALB (sin autenticacion, ver SecurityConfig)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Configuración para el login del panel de administración (Cognito ADMIN_USER_PASSWORD_AUTH)
cognito.user-pool-id=us-east-1_ZoKCVBrHG
cognito.client-id=3f6ndcnegj9ufuurqhet3soeme

# Clave entre servicios: si existe la variable de entorno INTERNAL_API_KEY (ECS) se usa esa
internal.api.key=${INTERNAL_API_KEY:nexo-internal-secret-2026-cambiar-en-produccion}
server.error.include-message=always

# Mensajería (SQS): colas que consume ms-users (las crea ms-queues)
nexo.mensajeria.region=us-east-1
nexo.mensajeria.cola-notificaciones=nexo-notificaciones
nexo.mensajeria.cola-puntos=nexo-puntos

# Puntos de fidelidad: 1 punto por cada 500 pesos
nexo.puntos.pesos-por-punto=500

# Canje: 1 punto vale $10 al pagar productos con puntos
nexo.puntos.pesos-por-punto-canje=10

# Vencimiento: meses de vigencia, fecha desde la que rige (los puntos anteriores vencen contando desde ahí) y días de aviso
nexo.puntos.meses-vigencia=12
nexo.puntos.vigencia-desde=2026-10-23
nexo.puntos.dias-aviso=30