spring.application.name=ms-users

# Puerto de ms-users (ms-stores: 8082, ms-products: 8083, ms-orders: 8084)
server.port=8081

# Conexión a MySQL — crea la base sola si no existe
spring.datasource.url=jdbc:mysql://localhost:3306/users_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate crea/actualiza las tablas automáticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Valida el JWT emitido por Cognito (Google como IdP) — misma URL en los 4 microservicios
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://cognito-idp.us-east-1.amazonaws.com/us-east-1_ZoKCVBrHG

# Logs detallados mientras se prueba
logging.level.com.nexo.msusers=DEBUG
logging.level.org.springframework.security=DEBUG
internal.api.key=nexo-internal-secret-2026-cambiar-en-produccion
server.error.include-message=always