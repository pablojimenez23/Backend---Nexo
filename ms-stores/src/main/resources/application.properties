spring.application.name=ms-stores

# Puerto de ms-stores (ms-users: 8081, ms-products: 8083, ms-orders: 8084)
server.port=8082

# Conexión a RDS — el endpoint se completa una vez creada la instancia en AWS
spring.datasource.url=jdbc:mysql://nexo-db.cg1wfibpbzep.us-east-1.rds.amazonaws.com:3306/stores_db?useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${username}
spring.datasource.password=${password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Limitar el pool de conexiones para no agotar el límite de RDS (db.t3.micro)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2

# Credenciales de RDS gestionadas por Secrets Manager
spring.config.import=aws-secretsmanager:nexo/rds/credentials

# Hibernate crea/actualiza las tablas automáticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Valida el JWT emitido por Cognito — el rol viaja en "cognito:groups"
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://cognito-idp.us-east-1.amazonaws.com/us-east-1_ZoKCVBrHG

# Logging reducido para producción
logging.level.com.nexo.msstores=INFO
logging.level.org.springframework.security=INFO

# Expone /actuator/health para el health check del ALB (sin autenticacion, ver SecurityConfig)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

internal.api.key=nexo-internal-secret-2026-cambiar-en-produccion
server.error.include-message=always