spring.application.name=ms-stores

# Puerto de ms-stores (ms-users: 8081, ms-products: 8083, ms-orders: 8084)
server.port=8082

# Conexión a MySQL — base propia de este microservicio
spring.datasource.url=jdbc:mysql://localhost:3306/stores_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate crea/actualiza las tablas automáticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Valida el JWT emitido por Cognito — el rol viaja en "cognito:groups"
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://cognito-idp.us-east-1.amazonaws.com/us-east-1_ZoKCVBrHG

# Logs detallados mientras se prueba
logging.level.com.nexo.msstores=DEBUG
logging.level.org.springframework.security=DEBUG