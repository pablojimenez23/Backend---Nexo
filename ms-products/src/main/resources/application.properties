spring.application.name=ms-products

server.port=8083

# Context path — el ALB enruta /products/* hacia este microservicio, sin quitar el prefijo
server.servlet.context-path=/products

# Conexión a RDS — el endpoint se completa una vez creada la instancia en AWS
spring.datasource.url=jdbc:mysql://nexo-db.cg1wfibpbzep.us-east-1.rds.amazonaws.com:3306/products_db?useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${username}
spring.datasource.password=${password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Limitar el pool de conexiones para no agotar el límite de RDS (db.t3.micro)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2

# Credenciales de RDS gestionadas por Secrets Manager
spring.config.import=aws-secretsmanager:nexo/rds/credentials

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.security.oauth2.resourceserver.jwt.issuer-uri=https://cognito-idp.us-east-1.amazonaws.com/us-east-1_ZoKCVBrHG

logging.level.com.nexo.msproducts=INFO
logging.level.org.springframework.security=INFO

# Expone /actuator/health para el health check del ALB (sin autenticacion, ver SecurityConfig)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

internal.api.key=nexo-internal-secret-2026-cambiar-en-produccion
spring.web.error.include-message=always

# Mensajería (SQS): cola que consume ms-products (la crea ms-queues)
nexo.mensajeria.region=us-east-1
nexo.mensajeria.cola-stock=nexo-stock

# Ofertas por tiempo limitado (la tienda paga el descuento; NEXO cobra su 12 % sobre el precio con oferta)
nexo.ofertas.descuento-minimo=10
nexo.ofertas.descuento-maximo=40
nexo.ofertas.duracion-minima-horas=6
nexo.ofertas.duracion-maxima-horas=72
nexo.ofertas.espera-horas=24
nexo.ofertas.maximo-activas-por-tienda=3
nexo.ofertas.precio-minimo=1000
nexo.ofertas.cupo-minimo=3
nexo.ofertas.cupo-maximo=100
nexo.ofertas.limite-por-pedido-defecto=2
nexo.ofertas.limite-por-pedido-maximo=5
nexo.ofertas.inicio-maximo-dias=7